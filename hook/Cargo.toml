[package]
name = "digitama-hook"
description = "Repassa os eventos de hook do Claude Code ao Digitama por named pipe, e expõe um servidor MCP (stdio) do pet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "digitama-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
